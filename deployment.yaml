apiVersion: apps/v1
kind: Deployment
metadata:
  name: grithika-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grithika-app
  template:
    metadata:
      labels:
        app: grithika-app
    spec:
      containers:
      - name: grithika-app
        image: grithika-app:v1
        ports:
        - containerPort: 8080
